name: SEO profily odrôd – synchronizácia Supabase
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate-varieties.mjs'
      - 'scripts/generate-seo.mjs'
      - 'scripts/generate-semena-paradajok.mjs'
      - 'scripts/semena-paradajok-template.txt'
      - 'scripts/variety-seo-lib.mjs'
      - 'tests/original-variety-descriptions.mjs'
      - '.github/workflows/sync-varieties.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: herba-varieties-seo
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verejný export aktuálnych odrôd
        run: node scripts/generate-varieties.mjs --write
      - name: Aktualizovať verejný katalóg semien paradajok
        run: node scripts/generate-semena-paradajok.mjs --write
      - name: Aktualizovať sitemap
        run: node scripts/generate-seo.mjs --write
      - name: Overiť export a testy
        run: |
          node scripts/generate-varieties.mjs --check
          node scripts/generate-seo.mjs --check
          node scripts/generate-semena-paradajok.mjs --check
          node --test tests/*.mjs
      - name: Zverejniť zmenené profily
        run: |
          git config user.name "Herba SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A odrody/ semena-paradajok/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "SEO: synchronizácia verejných odrôd"
            pushed=false
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Medzitým pribudol nový commit. Bezpečne aktualizujem vetvu (pokus $attempt/4)."
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "Zmeny sa nepodarilo bezpečne zlúčiť. Nič neprepisujem."
              exit 1
            fi
            sleep 2
          done
          if [ "$pushed" != true ]; then
            echo "Nepodarilo sa odoslať SEO profily ani po opakovaných pokusoch."
            exit 1
          fi
          fi
      - name: Vyžiadať obnovu GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "Pages sa obnoví pri ďalšom publikovaní."
