name: Mobilný katalóg – kontrola v Chromiu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'catalogue-ui.js'
      - 'catalogue-ui.css'
      - 'draft-varieties.js'
      - 'site-enhancements.js'
      - 'variety-bulk.js'
      - 'site-enhancements.css'
      - 'site-polish.css'
      - 'scripts/browser-test-mobile-cards.mjs'
      - '.github/workflows/test-mobile-cards.yml'
permissions:
  contents: read
jobs:
  responsive-cards:
    name: Mobil 320/390, desktop a správcovské funkcie
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inštalácia Playwright
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Pripraviť Chromium
        run: npx playwright install --with-deps chromium
      - name: Otestovať mobilné karty, admin prepínač, 3D štítky a desktop
        run: node scripts/browser-test-mobile-cards.mjs
