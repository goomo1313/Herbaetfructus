name: Kontrola webu Herba et Fructus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: JavaScript, katalóg a objednávky
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stiahnuť kód
        uses: actions/checkout@v5
      - name: Pripraviť Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Spustiť automatické kontroly
        run: node --test tests/*.mjs
